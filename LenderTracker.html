<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lender Tracker</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#293548; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --purple:#a78bfa;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:14px}
  a{color:var(--accent)}

  /* Layout */
  .app{display:flex; min-height:100vh}
  .nav{
    width:220px; background:#0b1220; border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:16px 12px; position:sticky; top:0; height:100vh;
  }
  .brand{font-weight:700; font-size:18px; padding:6px 10px 14px; letter-spacing:.3px}
  .brand small{display:block; color:var(--muted); font-weight:500; font-size:11px; letter-spacing:.5px; text-transform:uppercase}
  .nav button.navitem{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:none; color:var(--muted); padding:10px 12px;
    border-radius:10px; font-size:14px; margin-bottom:2px;
  }
  .nav button.navitem:hover{background:var(--panel); color:var(--text)}
  .nav button.navitem.active{background:var(--panel2); color:#fff}
  .nav .navitem .badge{margin-left:auto; background:var(--accent2); color:#031018; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700}
  .nav .spacer{flex:1}
  .whoami{padding:8px 10px; border-top:1px solid var(--line); margin-top:8px; color:var(--muted); font-size:12px}
  .whoami select{width:100%; margin-top:6px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .syncdot.ok{background:var(--green)} .syncdot.err{background:var(--red)} .syncdot.busy{background:var(--amber)}

  .main{flex:1; padding:22px 26px; max-width:1400px}
  .view{display:none} .view.active{display:block}
  h1{font-size:22px; margin:0 0 4px} h2{font-size:16px; margin:22px 0 10px}
  .sub{color:var(--muted); margin:0 0 18px}

  /* Cards / KPIs */
  .grid{display:grid; gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
  .kpi .label{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px}
  .kpi .value{font-size:26px; font-weight:700; margin-top:6px}
  .kpi .value small{font-size:14px; color:var(--muted); font-weight:500}

  .progresswrap{margin-top:10px}
  .bar{height:22px; background:var(--panel2); border-radius:999px; overflow:hidden; position:relative; border:1px solid var(--line)}
  .bar > span{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); width:0}
  .bar .target{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--amber)}
  .bar .target.max{background:var(--green)}
  .barlabels{display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:6px}

  /* Buttons */
  .btn{background:var(--accent2); color:#04121b; border:none; padding:9px 14px; border-radius:9px; font-weight:600}
  .btn:hover{background:var(--accent)}
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--panel2)}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:7px}
  .btn.danger{background:transparent;border:1px solid var(--red);color:#fca5a5}
  .btn.danger:hover{background:rgba(239,68,68,.12)}
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .toolbar input[type=text], .toolbar select{
    background:var(--panel); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px;
  }
  .toolbar .grow{flex:1; min-width:160px}

  /* Table */
  table{width:100%; border-collapse:collapse}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; user-select:none; white-space:nowrap}
  tbody tr:hover{background:var(--panel2)}
  td.name{font-weight:600}
  td .muted{color:var(--muted); font-size:12px}
  .rowclick{cursor:pointer}

  .pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap}
  .prio-High{background:rgba(239,68,68,.15); color:#fca5a5}
  .prio-Medium{background:rgba(245,158,11,.15); color:#fcd34d}
  .prio-Low{background:rgba(148,163,184,.15); color:#cbd5e1}

  .stagepill{border:1px solid var(--line)}

  /* Modal / drawer */
  .overlay{position:fixed; inset:0; background:rgba(2,6,23,.6); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; width:100%; max-width:640px; padding:22px}
  .drawer{max-width:760px}
  .modal h3{margin:0 0 14px; font-size:18px}
  .formgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .formgrid .full{grid-column:1/-1}
  .field label{display:block; color:var(--muted); font-size:12px; margin-bottom:4px}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:9px 10px; border-radius:8px;
  }
  .field textarea{min-height:70px; resize:vertical}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px}
  .modal-actions .left{margin-right:auto}

  /* Activity / tasks */
  .timeline{list-style:none; margin:0; padding:0}
  .timeline li{padding:10px 0; border-bottom:1px solid var(--line); display:flex; gap:12px}
  .timeline .dot{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:16px;flex:none}
  .timeline .meta{color:var(--muted); font-size:12px}
  .tasklist{list-style:none;margin:0;padding:0}
  .taskitem{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
  .taskitem.done{opacity:.55}
  .taskitem.done .ttitle{text-decoration:line-through}
  .taskitem input[type=checkbox]{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--green);cursor:pointer}
  .taskitem .ttitle{font-weight:600}
  .taskitem .tmeta{color:var(--muted);font-size:12px;margin-top:2px}
  .taskitem .overdue{color:#fca5a5}
  .taskitem .grow{flex:1}
  .daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .daynav .date{font-size:18px;font-weight:700}
  .weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
  .weekbar .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
  .weekbar .day:hover{background:var(--panel2)}
  .weekbar .day.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .weekbar .day .dow{color:var(--muted);font-size:11px;text-transform:uppercase}
  .weekbar .day .num{font-size:18px;font-weight:700}
  .weekbar .day .cnt{font-size:11px;color:var(--muted);margin-top:2px}
  .weekbar .day.today .num{color:var(--accent)}

  .empty{color:var(--muted); text-align:center; padding:40px 20px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .stagebars .row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .stagebars .row .nm{width:120px;color:var(--muted);font-size:12px;flex:none}
  .stagebars .row .track{flex:1;height:14px;background:var(--panel2);border-radius:999px;overflow:hidden}
  .stagebars .row .track > span{display:block;height:100%;background:var(--accent2)}
  .stagebars .row .ct{width:90px;text-align:right;font-size:12px;color:var(--muted);flex:none}

  /* Setup screen */
  .setup{max-width:620px;margin:8vh auto;text-align:center}
  .setup .card{text-align:left;padding:26px}
  .setup ol{margin:0 0 16px;padding-left:20px;color:var(--muted);line-height:1.7}
  .setup input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:9px;margin:10px 0}
  .banner{background:rgba(239,68,68,.12);border:1px solid var(--red);color:#fecaca;padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none}
  .banner.show{display:block}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:100}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:12px}
  @media(max-width:820px){
    .nav{width:64px}.brand small,.navitem span.lbl,.whoami{display:none}
    .split,.formgrid{grid-template-columns:1fr}
    .weekbar{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>
<div id="root"></div>

<div class="overlay" id="overlay"><div id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Lender Tracker — single-file app. Talks to a Google Apps
   Script web app (see google-apps-script/Code.gs) so a small
   team shares one live Google Sheet. Offline cache in browser.
   ============================================================ */

var STAGES = ['To Contact','Contacted','Engaged','Term Sheet','Due Diligence','Committed','Funded','Declined'];
var STAGE_COLORS = {
  'To Contact':'#94a3b8','Contacted':'#38bdf8','Engaged':'#818cf8','Term Sheet':'#a78bfa',
  'Due Diligence':'#f59e0b','Committed':'#22c55e','Funded':'#16a34a','Declined':'#64748b'
};
var SECURED_STAGES = ['Committed','Funded'];
var ACTIVE_STAGES = STAGES.filter(function(s){return s!=='Declined'});
var TYPES = ['Bank','Debt Fund','Private Credit','Mezzanine','Insurance','Family Office','Credit Union','Other'];
var PRIORITIES = ['High','Medium','Low'];
var ACTIVITY_TYPES = ['Call','Email','Meeting','Voicemail','LinkedIn','Note'];
var ACTIVITY_ICONS = {Call:'📞',Email:'✉️',Meeting:'🤝',Voicemail:'📱',LinkedIn:'in',Note:'📝'};

var LS_URL='lenderTracker.apiUrl', LS_ME='lenderTracker.me', LS_CACHE='lenderTracker.cache';

var state = {
  apiUrl: localStorage.getItem(LS_URL) || '',
  me: localStorage.getItem(LS_ME) || '',
  lenders:[], activities:[], tasks:[],
  config:{teamMembers:[], targetMin:20, targetMax:50},
  view:'dashboard',
  sync:'idle',
  filters:{search:'',stage:'',owner:'',type:''},
  sort:{key:'name',dir:1},
  selectedDay: todayStr()
};

/* ---------- utilities ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function uuid(){return 'id-'+Math.random().toString(36).slice(2)+'-'+(new Date().getTime().toString(36));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(m){var n=Number(m)||0; return '$'+ (n>=1000? (n/1000).toFixed(1)+'B' : n.toFixed(n%1?1:0)+'M');}
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function fmtDate(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); if(p.length<3) return s;
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------- API ---------- */
function api(action, payload){
  var url=state.apiUrl;
  if(!url) return Promise.reject(new Error('Not connected'));
  setSync('busy');
  var opts, target;
  if(payload===undefined){
    target=url+(url.indexOf('?')>-1?'&':'?')+'action='+encodeURIComponent(action);
    opts={method:'GET'};
  } else {
    target=url;
    opts={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,payload:payload})};
  }
  return fetch(target,opts).then(function(r){return r.json();}).then(function(j){
    if(!j || j.ok===false){ setSync('err'); throw new Error(j&&j.error||'Request failed'); }
    setSync('ok'); return j;
  }).catch(function(e){ setSync('err'); throw e; });
}
function setSync(s){state.sync=s;var d=document.getElementById('syncdot');if(d){d.className='syncdot '+(s==='ok'?'ok':s==='err'?'err':s==='busy'?'busy':'');}
  var t=document.getElementById('synctext');if(t){t.textContent = s==='ok'?'Synced':s==='err'?'Offline — using cache':s==='busy'?'Syncing…':'';}}

function loadAll(){
  return api('getAll').then(function(j){
    state.lenders=j.data.lenders||[];
    state.activities=j.data.activities||[];
    state.tasks=j.data.tasks||[];
    if(j.data.config){ state.config=j.data.config; }
    cache();
    render();
  });
}
function cache(){ try{localStorage.setItem(LS_CACHE,JSON.stringify({lenders:state.lenders,activities:state.activities,tasks:state.tasks,config:state.config}));}catch(e){} }
function loadCache(){ try{var c=JSON.parse(localStorage.getItem(LS_CACHE)||'null'); if(c){state.lenders=c.lenders||[];state.activities=c.activities||[];state.tasks=c.tasks||[];if(c.config)state.config=c.config;}}catch(e){} }

/* ---------- data ops (optimistic) ---------- */
function saveLender(obj){
  var isNew=!obj.id; if(isNew)obj.id=uuid();
  var i=idx(state.lenders,obj.id);
  if(i>-1) state.lenders[i]=Object.assign({},state.lenders[i],obj); else state.lenders.push(obj);
  cache(); render();
  return api('upsertLender',obj).then(function(j){var k=idx(state.lenders,obj.id); if(k>-1)state.lenders[k]=j.item; cache();}).catch(err);
}
function removeLender(id){
  state.lenders=state.lenders.filter(function(x){return x.id!==id;});
  state.activities=state.activities.filter(function(x){return x.lenderId!==id;});
  state.tasks=state.tasks.filter(function(x){return x.lenderId!==id;});
  cache(); render();
  return api('deleteLender',{id:id}).catch(err);
}
function addActivity(obj){
  obj.id=uuid(); state.activities.push(obj);
  // bump lender lastContact
  var li=idx(state.lenders,obj.lenderId);
  if(li>-1 && obj.date){ state.lenders[li].lastContact=obj.date; api('upsertLender',{id:obj.lenderId,lastContact:obj.date}).catch(function(){}); }
  cache(); render();
  return api('addActivity',obj).then(function(j){var k=idx(state.activities,obj.id);if(k>-1)state.activities[k]=j.item;cache();}).catch(err);
}
function removeActivity(id){state.activities=state.activities.filter(function(x){return x.id!==id;});cache();render();return api('deleteActivity',{id:id}).catch(err);}
function saveTask(obj){
  var isNew=!obj.id; if(isNew)obj.id=uuid();
  var i=idx(state.tasks,obj.id);
  if(i>-1)state.tasks[i]=Object.assign({},state.tasks[i],obj);else state.tasks.push(obj);
  cache();render();
  return api('upsertTask',obj).then(function(j){var k=idx(state.tasks,obj.id);if(k>-1)state.tasks[k]=j.item;cache();}).catch(err);
}
function toggleTask(id){
  var i=idx(state.tasks,id); if(i<0)return;
  var t=state.tasks[i]; var done=!(t.done===true||t.done==='TRUE'||t.done==='true');
  t.done=done; t.doneAt=done?todayStr():'';
  cache();render();
  return api('upsertTask',{id:id,done:done,doneAt:t.doneAt}).catch(err);
}
function removeTask(id){state.tasks=state.tasks.filter(function(x){return x.id!==id;});cache();render();return api('deleteTask',{id:id}).catch(err);}
function saveConfig(cfg){state.config=cfg;cache();render();return api('saveConfig',cfg).catch(err);}

function idx(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return i;return -1;}
function lenderById(id){var i=idx(state.lenders,id);return i>-1?state.lenders[i]:null;}
function isDone(t){return t.done===true||t.done==='TRUE'||t.done==='true';}
function err(e){toast('⚠ '+(e&&e.message||'Sync error'));}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var root=document.getElementById('root');
  if(!state.apiUrl){ root.innerHTML=setupScreen(); wireSetup(); return; }
  root.innerHTML =
    '<div class="app">'+navHTML()+'<div class="main">'+
      viewDashboard()+viewLenders()+viewTasks()+viewActivity()+viewSettings()+
    '</div></div>';
  activateView();
  wireNav();
  wireCurrentView();
}

function navHTML(){
  var overdue=openTasks().filter(function(t){return t.date && t.date<todayStr();}).length;
  var todayCount=state.tasks.filter(function(t){return t.date===state.selectedDay && !isDone(t);}).length;
  var items=[
    ['dashboard','📊','Dashboard',''],
    ['lenders','🏦','Lenders', state.lenders.length?String(state.lenders.length):''],
    ['tasks','✅','Daily Tasks', overdue?('!'+overdue):''],
    ['activity','🕑','Activity',''],
    ['settings','⚙️','Settings','']
  ];
  var me=state.me;
  return '<div class="nav">'+
    '<div class="brand">Lender Tracker<small>'+esc(money(state.config.targetMin))+'–'+esc(money(state.config.targetMax))+' package</small></div>'+
    items.map(function(it){
      return '<button class="navitem" data-view="'+it[0]+'"><span>'+it[1]+'</span><span class="lbl">'+it[2]+'</span>'+(it[3]?'<span class="badge">'+esc(it[3])+'</span>':'')+'</button>';
    }).join('')+
    '<div class="spacer"></div>'+
    '<div class="whoami"><span class="syncdot" id="syncdot"></span><span id="synctext"></span>'+
      '<div style="margin-top:8px">You are</div>'+
      '<select id="whoami">'+ ['']. concat(state.config.teamMembers).map(function(m){return '<option '+(m===me?'selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select>'+
    '</div>'+
  '</div>';
}

/* ---------- Dashboard ---------- */
function pipelineTotal(stages){return state.lenders.filter(function(l){return stages.indexOf(l.stage)>-1;}).reduce(function(a,l){return a+(Number(l.amount)||0);},0);}
function weightedTotal(){return state.lenders.filter(function(l){return ACTIVE_STAGES.indexOf(l.stage)>-1;}).reduce(function(a,l){var p=Number(l.probability); if(isNaN(p))p=defaultProb(l.stage); return a+(Number(l.amount)||0)*(p/100);},0);}
function defaultProb(stage){return {'To Contact':5,'Contacted':10,'Engaged':25,'Term Sheet':50,'Due Diligence':70,'Committed':90,'Funded':100,'Declined':0}[stage]||0;}

function viewDashboard(){
  var secured=pipelineTotal(SECURED_STAGES);
  var active=pipelineTotal(ACTIVE_STAGES);
  var weighted=weightedTotal();
  var tMin=Number(state.config.targetMin)||20, tMax=Number(state.config.targetMax)||50;
  var scaleMax=Math.max(tMax, active, secured)*1.05 || 50;
  var pct=function(v){return Math.min(100,(v/scaleMax)*100);};

  var byStage=STAGES.map(function(s){
    var arr=state.lenders.filter(function(l){return l.stage===s;});
    return {stage:s,count:arr.length,amt:arr.reduce(function(a,l){return a+(Number(l.amount)||0);},0)};
  });
  var maxStageCount=Math.max(1,Math.max.apply(null,byStage.map(function(x){return x.count;})));

  var todays=state.tasks.filter(function(t){return t.date===todayStr();});
  var todaysOpen=todays.filter(function(t){return !isDone(t);});
  var overdue=openTasks().filter(function(t){return t.date && t.date<todayStr();});

  // per-person workload
  var team=state.config.teamMembers||[];
  var workload=team.map(function(m){
    return {name:m,
      open:openTasks().filter(function(t){return t.assignee===m;}).length,
      lenders:state.lenders.filter(function(l){return l.owner===m && ACTIVE_STAGES.indexOf(l.stage)>-1;}).length};
  });

  var weekActs=state.activities.filter(function(a){return a.date && daysBetween(a.date,todayStr())<=7 && daysBetween(a.date,todayStr())>=0;}).length;

  return '<div class="view" data-view="dashboard">'+
    '<h1>Dashboard</h1><p class="sub">Live pipeline toward the '+money(tMin)+'–'+money(tMax)+' lending package.</p>'+
    '<div class="grid kpis">'+
      kpi('Secured (Committed + Funded)', money(secured), STAGE_COLORS['Committed'])+
      kpi('Weighted pipeline', money(weighted), '#a78bfa', 'probability-adjusted')+
      kpi('Active pipeline', money(active), '#38bdf8', ACTIVE_STAGES.length+' stages')+
      kpi('Lenders tracked', String(state.lenders.length), '#e2e8f0')+
    '</div>'+

    '<div class="card" style="margin-top:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline"><strong>Progress to target</strong>'+
        '<span class="hint">Secured '+money(secured)+' · Weighted '+money(weighted)+' · Active '+money(active)+'</span></div>'+
      '<div class="progresswrap"><div class="bar">'+

/* ---------- Lenders ---------- */
function filteredLenders(){
  var f=state.filters, s=(f.search||'').toLowerCase();
  var arr=state.lenders.filter(function(l){
    if(f.stage && l.stage!==f.stage)return false;
    if(f.owner && l.owner!==f.owner)return false;
    if(f.type && l.type!==f.type)return false;
    if(s){var hay=(l.name+' '+l.institution+' '+l.contact+' '+l.notes+' '+l.email).toLowerCase();if(hay.indexOf(s)<0)return false;}
    return true;
  });
  var k=state.sort.key, dir=state.sort.dir;
  arr.sort(function(a,b){
    var va=a[k], vb=b[k];
    if(k==='amount'){va=Number(va)||0;vb=Number(vb)||0;}
    else if(k==='stage'){va=STAGES.indexOf(a.stage);vb=STAGES.indexOf(b.stage);}
    else{va=(va||'').toString().toLowerCase();vb=(vb||'').toString().toLowerCase();}
    return va<vb?-1*dir:va>vb?1*dir:0;
  });
  return arr;
}
function viewLenders(){
  var team=state.config.teamMembers||[];
  var rows=filteredLenders();
  var opt=function(v,cur){return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(v||'')+'</option>';};
  return '<div class="view" data-view="lenders">'+
    '<h1>Lenders</h1><p class="sub">'+rows.length+' of '+state.lenders.length+' shown</p>'+
    '<div class="toolbar">'+
      '<input type="text" class="grow" id="f-search" placeholder="Search name, institution, contact, notes…" value="'+esc(state.filters.search)+'">'+
      '<select id="f-stage"><option value="">All stages</option>'+STAGES.map(function(s){return opt(s,state.filters.stage);}).join('')+'</select>'+
      '<select id="f-owner"><option value="">All owners</option>'+team.map(function(m){return opt(m,state.filters.owner);}).join('')+'</select>'+
      '<select id="f-type"><option value="">All types</option>'+TYPES.map(function(t){return opt(t,state.filters.type);}).join('')+'</select>'+
      '<button class="btn" id="add-lender">+ Lender</button>'+
    '</div>'+
    (rows.length? '<div class="card" style="padding:4px 0"><table><thead><tr>'+
      th('name','Lender')+th('institution','Institution')+th('type','Type')+th('stage','Stage')+
      th('amount','Indicated')+th('priority','Priority')+th('owner','Owner')+th('lastContact','Last contact')+'<th></th>'+

/* ---------- Daily Tasks ---------- */
function openTasks(){return state.tasks.filter(function(t){return !isDone(t);});}
function viewTasks(){
  var day=state.selectedDay;
  var dayTasks=state.tasks.filter(function(t){return t.date===day;});
  dayTasks.sort(function(a,b){return (isDone(a)?1:0)-(isDone(b)?1:0);});
  var overdue=openTasks().filter(function(t){return t.date && t.date<todayStr();});
  overdue.sort(function(a,b){return a.date<b.date?-1:1;});

  return '<div class="view" data-view="tasks">'+
    '<h1>Daily Tasks</h1><p class="sub">Completion checklist by day. Everyone sees the same live list.</p>'+
    weekBar()+
    '<div class="daynav">'+
      '<button class="btn ghost sm" id="day-prev">←</button>'+
      '<span class="date">'+dayLabel(day)+'</span>'+
      '<button class="btn ghost sm" id="day-next">→</button>'+
      '<button class="btn ghost sm" id="day-today">Today</button>'+
      '<input type="date" id="day-pick" value="'+day+'" style="background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:8px">'+
      '<span style="flex:1"></span>'+
      '<button class="btn" id="add-task">+ Task for this day</button>'+
    '</div>'+
    (dayTasks.length? '<ul class="tasklist">'+dayTasks.map(taskItem).join('')+'</ul>'
      : '<div class="empty">No tasks for '+dayLabel(day)+'. Add one to build the day’s checklist.</div>')+
    (overdue.length? '<h2>⚠ Overdue ('+overdue.length+')</h2><ul class="tasklist">'+overdue.map(taskItem).join('')+'</ul>':'')+
  '</div>';
}
function weekBar(){
  var base=state.selectedDay;
  var start=new Date(base+'T00:00:00'); start.setDate(start.getDate()-start.getDay()); // Sunday
  var cells='';
  for(var i=0;i<7;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var open=state.tasks.filter(function(t){return t.date===ds && !isDone(t);}).length;
    var total=state.tasks.filter(function(t){return t.date===ds;}).length;
    cells+='<div class="day'+(ds===base?' sel':'')+(ds===todayStr()?' today':'')+'" data-day="'+ds+'">'+
      '<div class="dow">'+d.toLocaleDateString(undefined,{weekday:'short'})+'</div>'+
      '<div class="num">'+d.getDate()+'</div>'+
      '<div class="cnt">'+(total? open+'/'+total : '—')+'</div></div>';
  }
  return '<div class="weekbar">'+cells+'</div>';
}
function dayLabel(ds){var d=new Date(ds+'T00:00:00');var s=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});if(ds===todayStr())s+=' · Today';return s;}
function taskItem(t){
  var l=lenderById(t.lenderId);
  var over=!isDone(t)&&t.date&&t.date<todayStr();
  return '<li class="taskitem'+(isDone(t)?' done':'')+'">'+
    '<input type="checkbox" data-task-toggle="'+t.id+'"'+(isDone(t)?' checked':'')+'>'+
    '<div class="grow"><div class="ttitle">'+esc(t.title)+'</div>'+
      '<div class="tmeta">'+

        (over?' · <span class="overdue">due '+fmtDate(t.date)+'</span>':(t.date&&t.date!==state.selectedDay?' · '+fmtDate(t.date):''))+
        (t.notes?' · '+esc(t.notes):'')+

    '<button class="btn ghost sm" data-task-edit="'+t.id+'">Edit</button>'+
  '</li>';
}

      '<button class="btn ghost" data-close>Cancel</button><button class="btn" data-save-task="'+(t.id||'')+'">Save</button></div>'+
  '</div>';
}

/* ============================================================
   WIRING
   ============================================================ */
function activateView(){
  var views=document.querySelectorAll('.view');
  for(var i=0;i<views.length;i++){views[i].classList.toggle('active',views[i].getAttribute('data-view')===state.view);}
  var navs=document.querySelectorAll('.navitem');
  for(var j=0;j<navs.length;j++){navs[j].classList.toggle('active',navs[j].getAttribute('data-view')===state.view);}
  setSync(state.sync);
}
function go(v){state.view=v;activateView();}
function wireNav(){
  document.querySelectorAll('.navitem').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-view'));};});
  var who=document.getElementById('whoami');
  if(who)who.onchange=function(){state.me=who.value;localStorage.setItem(LS_ME,state.me);toast('You are '+(state.me||'nobody set'));};
}

function wireCurrentView(){
  // global: goto buttons, task toggles present in multiple views
  document.querySelectorAll('[data-goto]').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-goto'));};});
  bindTaskToggles();

  // Lenders
  var add=document.getElementById('add-lender'); if(add)add.onclick=function(){openModal(lenderModal(null));wireLenderModal(null);};
  document.querySelectorAll('[data-sort]').forEach(function(th){th.onclick=function(){var k=th.getAttribute('data-sort');if(state.sort.key===k)state.sort.dir*=-1;else{state.sort.key=k;state.sort.dir=1;}render();};});
  ['search','stage','owner','type'].forEach(function(f){var e=document.getElementById('f-'+f);if(e){e.oninput=e.onchange=function(){state.filters[f]=e.value;
      // keep focus for search box
      if(f==='search'){var v=e.value;render();var s=document.getElementById('f-search');if(s){s.focus();s.value=v;s.setSelectionRange(v.length,v.length);}}
      else render();};}});
  document.querySelectorAll('[data-lender]').forEach(function(row){row.onclick=function(ev){ev.stopPropagation();var l=lenderById(row.getAttribute('data-lender'));if(l){openModal(lenderDrawer(l));wireDrawer(l);}};});

  wireTasksView();

  // Activity delete
  document.querySelectorAll('[data-act-del]').forEach(function(b){b.onclick=function(){removeActivity(b.getAttribute('data-act-del'));};});

  // Settings
  wireSettings();
}

function bindTaskToggles(){document.querySelectorAll('[data-task-toggle]').forEach(function(cb){cb.onclick=function(ev){ev.stopPropagation();toggleTask(cb.getAttribute('data-task-toggle'));};});}

function wireTasksView(){
  var prev=document.getElementById('day-prev'), next=document.getElementById('day-next'), today=document.getElementById('day-today'), pick=document.getElementById('day-pick'), addt=document.getElementById('add-task');
  function shift(n){var d=new Date(state.selectedDay+'T00:00:00');d.setDate(d.getDate()+n);state.selectedDay=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());render();}
  if(prev)prev.onclick=function(){shift(-1);};
  if(next)next.onclick=function(){shift(1);};
  if(today)today.onclick=function(){state.selectedDay=todayStr();render();};
  if(pick)pick.onchange=function(){state.selectedDay=pick.value;render();};
  if(addt)addt.onclick=function(){openModal(taskModal(null));wireTaskModal();};
  document.querySelectorAll('[data-day]').forEach(function(d){d.onclick=function(){state.selectedDay=d.getAttribute('data-day');render();};});
  document.querySelectorAll('[data-task-edit]').forEach(function(b){b.onclick=function(){var i=idx(state.tasks,b.getAttribute('data-task-edit'));if(i>-1){openModal(taskModal(state.tasks[i]));wireTaskModal();}};});
}

    var type=document.getElementById('a-type').value, date=document.getElementById('a-date').value, summary=document.getElementById('a-summary').value.trim();

  document.querySelectorAll('[data-add-task-lender]').forEach(function(b){b.onclick=function(){
    var title=document.getElementById('t-title').value.trim();if(!title){toast('Task title?');return;}
    saveTask({title:title,date:document.getElementById('t-date').value,assignee:document.getElementById('t-assignee').value,lenderId:l.id});
    var fresh=lenderById(l.id);openModal(lenderDrawer(fresh));wireDrawer(fresh);

  document.querySelectorAll('[data-act-del]').forEach(function(b){b.onclick=function(){removeActivity(b.getAttribute('data-act-del'));var fresh=lenderById(l.id);openModal(lenderDrawer(fresh));wireDrawer(fresh);};});

  bindTaskToggles();
  document.querySelectorAll('[data-task-edit]').forEach(function(b){b.onclick=function(){var i=idx(state.tasks,b.getAttribute('data-task-edit'));if(i>-1){openModal(taskModal(state.tasks[i]));wireTaskModal();}};});
}
function wireTaskModal(){
  document.querySelectorAll('[data-save-task]').forEach(function(b){b.onclick=function(){
    var id=b.getAttribute('data-save-task');

    var o={title:title,date:document.getElementById('t-date2').value,assignee:document.getElementById('t-assignee2').value,lenderId:document.getElementById('t-lender2').value,notes:document.getElementById('t-notes2').value.trim()};

function wireSettings(){
  var save=document.getElementById('s-save');
  if(save)save.onclick=function(){
    var team=document.getElementById('s-team').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    saveConfig({teamMembers:team,targetMin:Number(document.getElementById('s-min').value)||20,targetMax:Number(document.getElementById('s-max').value)||50});

  };
  var us=document.getElementById('s-url-save');

  var test=document.getElementById('s-test');
  if(test)test.onclick=function(){var u=document.getElementById('s-url').value.trim();if(!u){toast('Paste a URL first');return;}
    fetch(u+(u.indexOf('?')>-1?'&':'?')+'action=ping').then(function(r){return r.json();}).then(function(j){toast(j&&j.ok?'✓ Connection works':'Reached server but got an error');}).catch(function(){toast('✗ Could not reach that URL');});};
  var imp=document.getElementById('s-import');
  if(imp)imp.onclick=function(){importCSV(document.getElementById('s-csv').value);};
  var exp=document.getElementById('s-export');

/* ---------- CSV ---------- */
function parseCSVLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){var ch=line[i];
    if(q){ if(ch==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(ch==='"'){q=false;} else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===','){out.push(cur);cur='';} else cur+=ch; }
  }
  out.push(cur); return out.map(function(s){return s.trim();});
}
function importCSV(text){
  text=(text||'').trim(); if(!text){toast('Paste some rows first');return;}
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var cols=['name','institution','type','contact','email','phone','stage','priority','owner','amount','notes'];
  var start=0;
  if(/name/i.test(lines[0])&&/institution|firm|contact/i.test(lines[0])) start=1;
  var items=[],n=0;
  for(var i=start;i<lines.length;i++){
    var c=parseCSVLine(lines[i]); if(!c[0])continue;
    var o={};cols.forEach(function(k,idx){o[k]=c[idx]||'';});
    if(!o.stage||STAGES.indexOf(o.stage)<0)o.stage='To Contact';
    if(!o.priority||PRIORITIES.indexOf(o.priority)<0)o.priority='Medium';
    if(!o.type||TYPES.indexOf(o.type)<0)o.type='Other';
    o.id=uuid();
    items.push(o);n++;
  }
  if(!n){toast('No rows parsed');return;}
  items.forEach(function(o){state.lenders.push(o);});
  cache();render();
  api('bulkUpsertLenders',{items:items}).then(function(){toast('Imported '+n+' lenders');go('lenders');}).catch(err);
}
function exportCSV(){
  var cols=['name','institution','type','contact','email','phone','stage','priority','owner','amount','probability','lastContact','nextAction','nextActionDate','notes'];
  var rows=[cols.join(',')];
  state.lenders.forEach(function(l){rows.push(cols.map(function(k){var v=(l[k]==null?'':String(l[k]));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','));});
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lenders.csv';a.click();
}

/* ---------- Setup screen ---------- */
function setupScreen(){
  return '<div class="setup"><div class="brand" style="font-size:26px;margin-bottom:10px">🏦 Lender Tracker</div>'+
    '<div class="card"><h3 style="margin-top:0">Connect to your shared Google Sheet</h3>'+
      '<p class="hint">One-time, ~3 minutes. Then your whole team shares one live list.</p>'+
      '<ol>'+
        '<li>Create a new Google Sheet at <strong>sheets.new</strong></li>'+
        '<li>Open <strong>Extensions → Apps Script</strong></li>'+
        '<li>Paste in the code from <strong>google-apps-script/Code.gs</strong> (in this repo) and Save</li>'+
        '<li><strong>Deploy → New deployment → Web app</strong>. Execute as <em>Me</em>, access <em>Anyone</em>. Copy the URL.</li>'+
        '<li>Paste that URL below. Give the same URL to your teammates.</li>'+
      '</ol>'+
      '<div class="banner" id="setup-err"></div>'+
      '<input type="text" id="setup-url" placeholder="https://script.google.com/macros/s/……/exec">'+
      '<button class="btn" id="setup-go" style="width:100%">Connect</button>'+
    '</div></div>';
}
function wireSetup(){
  var go=document.getElementById('setup-go'), input=document.getElementById('setup-url'), banner=document.getElementById('setup-err');
  function attempt(){
    var u=(input.value||'').trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){banner.textContent='That doesn’t look like an Apps Script /exec URL. It should end in /exec.';banner.classList.add('show');return;}
    go.textContent='Connecting…';go.disabled=true;
    fetch(u+'?action=ping').then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){state.apiUrl=u;localStorage.setItem(LS_URL,u);boot();}
      else throw new Error('Server responded with an error');
    }).catch(function(){banner.textContent='Could not reach that URL. Check the deployment is a Web App with access set to “Anyone”.';banner.classList.add('show');go.textContent='Connect';go.disabled=false;});
  }
  if(go)go.onclick=attempt;
  if(input)input.onkeydown=function(e){if(e.key==='Enter')attempt();};
}

/* ---------- overlay / boot ---------- */
document.getElementById('overlay').onclick=function(e){if(e.target===this)closeModal();};
document.addEventListener('click',function(e){if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-close'))closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

function boot(){
  loadCache();
  render();
  if(state.apiUrl){
    loadAll().catch(function(){toast('Working offline — showing last saved data');render();});
  }
}
// gentle auto-refresh so teammates see each other's edits (skips while a modal is open)
setInterval(function(){
  if(state.apiUrl && !document.getElementById('overlay').classList.contains('open')){
    loadAll().catch(function(){});
  }
}, 30000);

boot();
